<style>
@font-face { font-family: "Schibsted Grotesk"; src: url(/vendor/SchibstedGrotesk-latin.woff2) format("woff2"); font-weight: 400 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/vendor/JetBrainsMono-latin.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }

/* --- tokens --- */
:root {
  --bg: #eceff2; --surface: #ffffff; --sunk: #e3e7eb; --line: #d5dbe1; --line-2: #c3cbd3;
  --ink: #141c24; --ink-2: #566472; --ink-3: #8794a1;
  --amber: #c98a0b; --amber-ink: #fff; --amber-soft: #fbefd2; --ok: #1f8a5b; --err: #c2412d; --link: #2d68a8;
  --user-bg: #1b2631; --user-ink: #eef1f4;
  --rail: #18222c; --rail-ink: #dfe5ea;
  --f-pessoal: #1d9264; --f-comercial: #3567d6; --f-suporte: #9348c9;
  --wabg: #e6eaed; --wadot: #d6dce1; --in: #ffffff; --out: #d8f3de; --out-ink: #10261a;
  --av-l: 88%; --av-s: 42%; --av-ink-l: 30%;
  --shadow: 0 1px 2px rgba(20,28,36,.06), 0 8px 28px rgba(20,28,36,.12);
  --shadow-lg: 0 18px 60px rgba(20,28,36,.22);
  --sans: "Schibsted Grotesk", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 12px; --ease: cubic-bezier(.2,.8,.2,1);
  --app-h: 100dvh;
  interpolate-size: allow-keywords;
  color-scheme: light;
}
:root[data-theme=dark] {
  --bg: #0e1319; --surface: #151c24; --sunk: #1c252f; --line: #26313c; --line-2: #34414e;
  --ink: #e3e8ed; --ink-2: #94a0ad; --ink-3: #66727f;
  --amber: #f0b23a; --amber-ink: #12171c; --amber-soft: #3a2f1a; --ok: #5cc39a; --err: #ef6f62; --link: #79b4ea;
  --user-bg: #253747; --user-ink: #e7ecf0; --rail: #0a0e13; --rail-ink: #cfd7de;
  --f-pessoal: #4cc38f; --f-comercial: #7ea2f2; --f-suporte: #c18be8;
  --wabg: #0b1015; --wadot: #141b22; --in: #1a232c; --out: #1d4434; --out-ink: #e1f2e7;
  --av-l: 24%; --av-s: 30%; --av-ink-l: 82%;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.45); --shadow-lg: 0 18px 60px rgba(0,0,0,.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #0e1319; --surface: #151c24; --sunk: #1c252f; --line: #26313c; --line-2: #34414e;
    --ink: #e3e8ed; --ink-2: #94a0ad; --ink-3: #66727f;
    --amber: #f0b23a; --amber-ink: #12171c; --amber-soft: #3a2f1a; --ok: #5cc39a; --err: #ef6f62; --link: #79b4ea;
    --user-bg: #253747; --user-ink: #e7ecf0; --rail: #0a0e13; --rail-ink: #cfd7de;
    --f-pessoal: #4cc38f; --f-comercial: #7ea2f2; --f-suporte: #c18be8;
    --wabg: #0b1015; --wadot: #141b22; --in: #1a232c; --out: #1d4434; --out-ink: #e1f2e7;
    --av-l: 24%; --av-s: 30%; --av-ink-l: 82%;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.45); --shadow-lg: 0 18px 60px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}

/* --- base --- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 5px 11px; font-size: 13.5px; transition: background .15s, border-color .15s, color .15s, transform .12s; }
button:hover { border-color: var(--line-2); }
button:active { transform: scale(.97); }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--link); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-2); }
[hidden] { display: none !important; }

/* indicadores: anel tracejado (trabalhando), ponto (novidade), luz (estado) */
.orb { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px dashed var(--amber); position: relative; animation: spin 2.6s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--amber); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; animation: pop .35s var(--ease); }
.dot.err { background: var(--err); }
.light { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; display: inline-block; }
.light.ok { background: var(--ok); } .light.warn { background: var(--amber); } .light.err { background: var(--err); }
.light.busy { background: var(--amber); animation: pulse 1.1s infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.35); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes tabin { from { opacity: 0; transform: translateY(6px) scale(.94); } }
@keyframes sheetup { from { transform: translateY(100%); } }
@keyframes dropin { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

.ib { border: 0; background: transparent; padding: 0; border-radius: 9px; color: var(--ink-2); width: 34px; height: 34px; display: inline-grid; place-items: center; flex: none; position: relative; }
.ib:hover { background: var(--sunk); color: var(--ink); }
.ib svg.i { width: 18px; height: 18px; }
.count { position: absolute; top: 1px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--amber); color: var(--amber-ink); font: 700 10.5px/17px var(--sans); text-align: center; animation: pop .35s var(--ease); }
.chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 8px; background: var(--sunk); border: 1px solid transparent; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; color: var(--ink-2); }
.chip:hover { border-color: var(--line); color: var(--ink); }
.chip.locked { cursor: default; }
.badge { font-size: 11.5px; background: var(--sunk); color: var(--ink-2); padding: 0 7px; border-radius: 99px; flex: none; line-height: 19px; font-variant-numeric: tabular-nums; }
.badge.amber { background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.field { width: 100%; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); outline: 0; font-size: 14px; color: var(--ink); }
.field:focus { border-color: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 18%, transparent); }

/* --- estrutura --- */
.app { display: flex; height: var(--app-h); }
.rail { width: 60px; flex: none; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom)); gap: 3px; z-index: 2; }
.rail .mark { width: 32px; height: 32px; margin-bottom: 12px; }
.rail .mark .ring { transform-origin: 50px 50px; }
body.busy .rail .mark .ring { animation: spin 6s linear infinite; }
.rail button { width: 44px; height: 44px; border: 0; background: transparent; color: inherit; border-radius: 12px; display: grid; place-items: center; opacity: .6; padding: 0; position: relative; }
.rail button:hover { opacity: 1; background: rgba(255,255,255,.07); }
.rail button.on { opacity: 1; background: rgba(255,255,255,.11); }
.rail button.on::before { content: ""; position: absolute; left: -8px; top: 11px; bottom: 11px; width: 3px; border-radius: 2px; background: var(--amber); }
.rail .count { top: 4px; right: 3px; }
.rail .grow { flex: 1; }
.bay { display: grid; grid-template-columns: repeat(2, 8px); gap: 6px; padding: 8px 0; cursor: pointer; }
.host { writing-mode: vertical-rl; transform: rotate(180deg); font: 500 11px var(--mono); letter-spacing: .06em; opacity: .5; margin-top: 4px; }

.side { width: 300px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#side { display: contents; }
.side header { padding: calc(14px + env(safe-area-inset-top)) 14px 10px 16px; display: flex; align-items: center; gap: 8px; }
.side header h2 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -.02em; }
.side .body { flex: 1; overflow-y: auto; padding: 0 8px 16px; min-height: 0; overscroll-behavior: contain; }
.side .search { padding: 0 14px 8px; }
.newbtn { display: inline-flex; align-items: center; gap: 5px; background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 600; padding: 6px 12px 6px 9px; }
.newbtn:hover { border-color: transparent; opacity: .9; }
.newbtn svg.i { width: 16px; height: 16px; }
.group { font-size: 12.5px; color: var(--ink-2); padding: 16px 8px 5px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
.group button { margin-left: auto; padding: 1px 8px; font-size: 12px; }

.item { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 10px; cursor: pointer; font-size: 14px; min-width: 0; position: relative; transition: background .15s; }
.item:hover { background: var(--sunk); }
.item.on { background: var(--amber-soft); }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.unread .t { font-weight: 600; }
.item .sub { display: block; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
.item .when { color: var(--ink-3); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
.item .ind { width: 14px; display: grid; place-items: center; flex: none; }
.item .acts { display: none; gap: 2px; flex: none; }
.item:hover .acts, .item:focus-within .acts { display: flex; }
.item:hover .when { display: none; }
.acts button { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border-color: transparent; background: transparent; color: var(--ink-2); }
.acts button:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
.acts svg.i { width: 15px; height: 15px; }
.pin { color: var(--amber); font-size: 10px; }

.usage { flex: none; border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); font-size: 11.5px; color: var(--ink-2); display: grid; gap: 8px; }
.usage:empty { display: none; }
.usage .row { display: grid; gap: 3px; }
.usage .top { display: flex; gap: 6px; align-items: baseline; }
.usage .top b { color: var(--ink); font-weight: 600; }
.usage .top .pct { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
.usage .bar { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.usage .bar i { display: block; height: 100%; background: var(--ok); transition: width .5s var(--ease); border-radius: 3px; }
.usage .bar i.warn { background: var(--amber); } .usage .bar i.err { background: var(--err); }
.usage .eta { font-variant-numeric: tabular-nums; } .usage .eta.warn { color: var(--amber); } .usage .eta.err { color: var(--err); }

.crumbs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 14px 6px; font: 12.5px var(--mono); }
.crumbs a { color: var(--ink-2); cursor: pointer; padding: 1px 3px; border-radius: 4px; text-decoration: none; }
.crumbs a:hover { color: var(--ink); background: var(--sunk); }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
.toolbar button { font-size: 12.5px; padding: 4px 10px; }
.fico { width: 18px; text-align: center; flex: none; color: var(--ink-3); font-size: 13px; }
.fico.d { color: var(--amber); }
.card { border: 1px solid var(--line); border-radius: var(--r); margin: 6px 0; padding: 10px 12px; font-size: 13.5px; background: var(--bg); }
.card .row { display: flex; align-items: center; gap: 8px; }
.card .row b { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .desc { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; }
.card .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.card .btns button { font-size: 12px; padding: 3px 10px; }
.card details summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.taglist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.taglist span { font: 11.5px var(--mono); background: var(--sunk); padding: 1px 6px; border-radius: 5px; }
.skill { padding: 7px 9px; border-radius: 10px; cursor: pointer; font-size: 13.5px; }
.skill:hover { background: var(--sunk); }
.skill b { font: 500 13px var(--mono); }
.skill div { color: var(--ink-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* --- área principal: faixa de abas + painéis --- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 4px; padding: calc(6px + env(safe-area-inset-top)) 8px 0 8px; background: var(--bg); min-height: 48px; position: relative; z-index: 1; }
.top .m { display: none; }
.tabs { flex: 1; min-width: 0; position: relative; display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; align-items: flex-end; align-self: stretch; scroll-snap-type: x proximity; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 12px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 13.5px; color: var(--ink-2); max-width: 230px; min-width: 0; flex: 0 1 auto; position: relative; user-select: none; scroll-snap-align: start; transition: background .15s, color .15s; }
.tab.enter { animation: tabin .28s var(--ease); }
.tab:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--ink); }
.tab.vis { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 -1px 0 var(--line), 1px 0 0 var(--line), -1px 0 0 var(--line); }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--amber); }
.tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tab .ti { display: grid; place-items: center; width: 16px; flex: none; color: var(--ink-3); }
.tab .ti svg.i { width: 15px; height: 15px; }
.tab .tc { font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--amber); border-radius: 99px; padding: 0 5px; line-height: 16px; flex: none; }
.tab .tx { width: 24px; height: 24px; padding: 0; border: 0; background: transparent; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); opacity: 0; flex: none; }
.tab:hover .tx, .tab.on .tx { opacity: 1; }
.tab .tx:hover { background: var(--sunk); color: var(--ink); }
.tab .tx svg.i { width: 14px; height: 14px; }
.top .plus { align-self: center; }
.tab .tn { font: 600 10.5px/16px var(--sans); min-width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 5px; text-align: center; flex: none; color: var(--ink-2); }
.tabrow { cursor: pointer; } .tabrow .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .tabrow.cur { background: var(--amber-soft); font-weight: 600; } .tabrow .ti { width: 18px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.tabrow .tc { font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--amber); border-radius: 99px; padding: 0 6px; line-height: 17px; flex: none; }
.tabrow .ib { width: 36px; height: 36px; margin: -6px -6px -6px 0; }

.panes { flex: 1; display: flex; min-width: 0; min-height: 0; gap: 0; background: var(--surface); border-top: 1px solid var(--line); }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--surface); container-type: inline-size; }
.panes.multi .pane + .pane:not([hidden]) { border-left: 1px solid var(--line); }
.panes.multi .pane { flex-basis: 0; }
.panes.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 1px; background: var(--line); }
.panes.grid .pane + .pane:not([hidden]) { border-left: 0; }
.pane.appear { animation: rise .32s var(--ease); }
.panes.multi .pane.on > .ph::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--amber); }
.ph { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 16px; min-height: 50px; border-bottom: 1px solid var(--line); position: relative; flex: none; }
.ph .pt { font-weight: 650; font-size: 15px; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.ph .pt[contenteditable=true] { outline: 2px solid var(--amber); border-radius: 5px; padding: 0 4px; text-overflow: clip; }
.ph .sp { flex: 1; }
.ph .st { display: grid; place-items: center; width: 14px; flex: none; }
.goalchip { max-width: 40%; cursor: help; background: var(--amber-soft); color: var(--ink); }

/* --- conversa --- */
.scroller { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-padding-bottom: 20px; }
.thread { max-width: 800px; margin: 0 auto; padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 18px; }
.enter { animation: rise .3s var(--ease); }
.empty { margin: 7vh auto 0; max-width: 520px; width: 100%; }
.empty h1 { font-size: clamp(28px, 6cqi, 40px); font-weight: 750; letter-spacing: -.035em; line-height: 1.05; margin: 0 0 8px; }
.empty p { color: var(--ink-2); margin: 0 0 22px; max-width: 46ch; }
.starts { display: grid; gap: 7px; }
.starts button { text-align: left; padding: 11px 14px; border-radius: 12px; font-size: 14.5px; display: flex; gap: 10px; align-items: center; background: var(--bg); border-color: transparent; }
.starts button:hover { border-color: var(--line-2); background: var(--surface); }
.starts button span { color: var(--ink-3); font-size: 12.5px; margin-left: auto; font-family: var(--mono); }
.where { margin-top: 20px; font-size: 13px; color: var(--ink-2); }

.msg-user { align-self: flex-end; max-width: 85%; background: var(--user-bg); color: var(--user-ink); padding: 10px 15px; border-radius: 18px 18px 5px 18px; white-space: pre-wrap; word-wrap: break-word; }
.msg-user.queued { opacity: .65; border: 1px dashed var(--line-2); background: transparent; color: var(--ink); display: flex; gap: 10px; align-items: center; }
.msg-user.queued .q { font-size: 11px; color: var(--amber); font-weight: 600; flex: none; }
.msg-user.queued button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; flex: none; }
.msg-assistant { min-width: 0; }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .75em; }
.md code { font: 13px/1.5 var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--bg); border: 1px solid var(--line); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; margin: .6em 0; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--sunk); font-weight: 600; }
.md ul, .md ol { padding-left: 1.3em; margin: 0 0 .75em; }
.md blockquote { margin: 0 0 .75em; padding-left: 12px; border-left: 3px solid var(--line-2); color: var(--ink-2); }
.md h1, .md h2, .md h3 { font-size: 1.08em; margin: 1.1em 0 .4em; letter-spacing: -.01em; }
.foot { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-variant-numeric: tabular-nums; }

details::details-content { block-size: 0; overflow: clip; transition: block-size .22s var(--ease), content-visibility .22s allow-discrete; }
details[open]::details-content { block-size: auto; }
.tools { margin: 6px 0 12px; border: 1px solid var(--line); border-radius: 11px; font-size: 13px; background: var(--bg); }

// Bloco ```escolha {json}``` do assistente vira um checklist clicável: opções pré-marcadas, campo "outro" e
// "Enviar" (ou "Editar antes", que só joga a resposta no campo de texto). Formato:
// {"titulo":"…","itens":[{"id":"H01","pergunta":"…","opcoes":["Sim","Não"],"padrao":0,"multi":false}]}
const ESC_RE = /```escolha\s*\n([\s\S]*?)```/g;
function renderEscolhas(text, pane) {
  let out = "", last = 0, m;
  ESC_RE.lastIndex = 0;
  while ((m = ESC_RE.exec(text))) {
    out += `<div class="md">${md(text.slice(last, m.index))}</div>`;
    last = ESC_RE.lastIndex;
    let spec; try { spec = JSON.parse(m[1]); } catch { out += `<div class="md">${md(m[0])}</div>`; continue; }
    const key = "e" + [...m[1]].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
    const st = (pane.escolhas ||= {});
    out += `<form class="escolha" data-esc="${key}">${spec.titulo ? `<b>${esc(spec.titulo)}</b>` : ""}`
      + (spec.itens || []).map((it, n) => {
        const id = it.id || `Q${n + 1}`, nome = `${key}-${n}`, type = it.multi ? "checkbox" : "radio";
        const sel = st[nome] ?? (it.multi ? [].concat(it.padrao ?? []) : [it.padrao ?? 0]);
        return `<fieldset data-id="${esc(id)}" data-n="${nome}"><legend><span class="mono">${esc(id)}</span> ${esc(it.pergunta || "")}</legend>`
          + (it.opcoes || []).map((o, j) => `<label><input type="${type}" name="${nome}" value="${j}"${sel.includes(j) ? " checked" : ""}> ${esc(o)}</label>`).join("")
          + `<input type="text" class="outro" placeholder="Outro / observação" value="${esc(st[nome + "-o"] || "")}"></fieldset>`;
      }).join("")
      + `<div class="esc-acts"><button type="submit">Enviar</button><button type="button" data-edit>Editar antes</button></div></form>`;
  }
  return out + `<div class="md">${md(text.slice(last))}</div>`;
}
function bindEscolhas(el, pane) {
  $$("form.escolha", el).forEach((f) => {
    const st = (pane.escolhas ||= {});
    const compose = () => $$("fieldset", f).map((fs) => {
      const n = fs.dataset.n, opts = $$("label", fs).map((l) => l.textContent.trim());
      const vals = $$("input:checked", fs).map((i) => +i.value); st[n] = vals;
      const outro = $(".outro", fs).value.trim(); st[n + "-o"] = outro;
      return `${fs.dataset.id}: ${[...vals.map((v) => opts[v]), outro].filter(Boolean).join("; ") || "(sem resposta)"}`;

// Horários sempre em Brasília, seja qual for o fuso do aparelho.
const TZ = "America/Sao_Paulo";
const fDay = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

const dayKey = (t) => fDay.format(t);
const hm = (t) => fHM.format(t);
function waWhen(t) {
  if (!t) return "";
  const k = dayKey(t);
  if (k === dayKey(Date.now())) return hm(t);
  if (k === dayKey(Date.now() - 864e5)) return "ontem";
  if (Date.now() - t < 6 * 864e5) return fWd.format(t).replace(".", "");

}

  const k = dayKey(t);
  if (k === dayKey(Date.now())) return "Hoje";
  if (k === dayKey(Date.now() - 864e5)) return "Ontem";
  return Date.now() - t < 300 * 864e5 ? fLong.format(t) : fLongY.format(t);

const fsCache = new Map();
async function fsList(path) {
  if (fsCache.has(path) && Date.now() - fsCache.get(path).at < 15000) return fsCache.get(path).data;
  const r = await api(`/api/fs?path=${encodeURIComponent(path)}&hidden=1`);
  const data = r.ok ? await r.json() : { entries: [] };
  fsCache.set(path, { at: Date.now(), data }); return data;
}
function closeAc(p) { p.ac.hidden = true; p.acItems = null; }
async function updateAc(p) {
  const v = p.input.value, at = p.input.selectionStart, pre = v.slice(0, at);
  let m;
  if ((m = pre.match(/(?:^|\s)\/([\w:.-]*)$/))) {
    const q = m[1].toLowerCase();
    const builtins = [{ name: "goal", description: "Objetivo: o Claude só para quando a condição for cumprida (um verificador confere a cada parada). /goal clear encerra." }];
    const items = [...builtins, ...(S.catalog?.skills || [])].filter((s) => s.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q)).slice(0, 40)
      .map((s) => ({ label: "/" + s.name, desc: s.description, value: "/" + s.name + " " }));
    return showAc(p, items, at - m[1].length - 1, at);
  }
  if ((m = pre.match(/(?:^|\s)@(\S*)$/))) {
    const token = m[1];
    let full = token.startsWith("/") ? token : token.startsWith("~") ? home() + token.slice(1) : `${p.cwd.replace(/^~/, home())}/${token}`;
    const cut = full.lastIndexOf("/"), dir = full.slice(0, cut) || "/", prefix = full.slice(cut + 1).toLowerCase();
    const seq = (p.acSeq = (p.acSeq || 0) + 1);
    const data = await fsList(dir);
    if (seq !== p.acSeq) return;
    const items = (data.entries || []).filter((e) => e.name.toLowerCase().startsWith(prefix) && (prefix.startsWith(".") || !e.name.startsWith(".")))
      .slice(0, 50).map((e) => { const path = (dir === "/" ? "" : dir) + "/" + e.name; return { label: e.name + (e.dir ? "/" : ""), desc: e.dir ? "" : size(e.size), value: "@" + path + (e.dir ? "/" : " "), keep: e.dir }; });
    return showAc(p, items, at - token.length - 1, at);
  }
  closeAc(p);
}
function showAc(p, items, from, to) {
  if (!items.length) return closeAc(p);
  p.acItems = items; p.acSel = 0; p.acRange = [from, to];
  p.ac.innerHTML = items.map((it, i) => `<div data-i="${i}"${i ? "" : ' class="on"'}><b>${esc(it.label)}</b><span>${esc(it.desc || "")}</span></div>`).join("");
  p.ac.hidden = false;
  p.ac.onpointerdown = (e) => { const d = e.target.closest("[data-i]"); if (d) { e.preventDefault(); pickAc(p, +d.dataset.i); } };
}

// --- microfone: grava, transcreve na GPU e põe o texto no campo ---------------------------
function setupMic(p, mic) {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
  mic.hidden = false; let rec = null;
  mic.onclick = async () => {
    if (mic.classList.contains("busy")) return;
    if (rec) return rec.stop();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast("Microfone bloqueado neste navegador"); }
    const chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      const type = rec.mimeType; rec = null;
      mic.className = "ib mic busy"; mic.innerHTML = ic("refresh");
      try {
        const r = await fetch("/api/transcribe", { method: "POST", headers: { "content-type": type }, body: new Blob(chunks, { type }) });
        const out = await r.json(); if (!r.ok) throw new Error(out.error || r.status);
        if (out.text) p.insert(out.text);
      } catch (err) { toast("Falha na transcrição"); console.error(err); }
      mic.className = "ib mic"; mic.innerHTML = ic("mic");
    };
    rec.start(); mic.className = "ib mic rec"; mic.innerHTML = ic("stop");
  };
}

// Web push: inscreve este aparelho no servidor (precisa de permissão já dada; no iPhone, só no app da tela inicial).
async function pushSubscribe(test) {
  const reg = await swReady;
  if (!reg?.pushManager) throw new Error("este navegador não tem push");
  const { key } = await getJSON("/api/push/key");
  if (!key) throw new Error("servidor sem chave");
  const raw = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - key.length % 4) % 4)), (ch) => ch.charCodeAt(0));
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
  return api("/api/push/subscribe", { subscription: sub.toJSON(), test });
}
// Aparelho sem push: mostra um aviso com botão. No iPhone a permissão e a inscrição só saem de um toque.
swReady.then(async (reg) => {
  if (!reg?.pushManager || !window.Notification || Notification.permission === "denied") return;
  if (Notification.permission === "granted" && await reg.pushManager.getSubscription()) return pushSubscribe(false).catch(() => {}); // renova
  if (localStorage.getItem("push.adiado") > Date.now()) return;
  const el = document.createElement("div");
  el.className = "notice pushask";
  el.innerHTML = `<b>🔔 Ativar notificações neste aparelho?</b><span>Avisos de conversa terminada mesmo com o app fechado.</span><div style="display:flex;gap:8px;margin-top:8px"><button data-sim class="newbtn">Ativar</button><button data-nao>Agora não</button></div>`;
  el.querySelector("[data-nao]").onclick = (e) => { e.stopPropagation(); localStorage.setItem("push.adiado", Date.now() + 7 * 864e5); el.remove(); };
  el.querySelector("[data-sim]").onclick = async (e) => {
    e.stopPropagation();
    try {
      const p = await Notification.requestPermission();
      if (p !== "granted") throw new Error("permissão negada nos ajustes");
      await pushSubscribe(true); el.remove(); toast("Notificações ligadas ✅");
    } catch (err) { toast("Não ligou: " + err.message); }
  };
  document.body.appendChild(el);
});
function sysNotify(title, opts, onclick) {
  opts = { icon: "/favicon.svg", ...opts };

    if (reg) return reg.showNotification(title, opts);
    const sys = new Notification(title, opts);

  }).catch(() => {});
  return true;
}

}

class AgendaPane {
  kind = "agenda";
  constructor() {
    this.filtro = localStorage.getItem("v2.agenda.filtro") || "todos"; this.dados = null;

    this.box = $(".hub", this.el);
    bindCommon(this);
    this.el.addEventListener("click", (e) => {
      if (e.target.closest('[data-a="reload"]')) return this.load();
      const f = e.target.closest("[data-f]"); if (f) { this.filtro = f.dataset.f; localStorage.setItem("v2.agenda.filtro", this.filtro); this.render(); }
    });
    this.timer = setInterval(() => { if (document.visibilityState === "visible") this.load(); }, 120e3);
    this.tick = setInterval(() => this.dados && this.render(), 60e3);
  }
  async load() {
    try { const r = await fetch("/api/agenda?dias=21", { cache: "no-store" }); this.dados = await r.json(); if (!r.ok) throw new Error(this.dados.error || r.status); }
    catch (e) { this.dados = null; this.box.innerHTML = `<p class="none">Não consegui ler a agenda: ${esc(e.message)}</p>`; return; }
    this.render(); renderTabsSoon();
  }
  render() {
    const { proximos = [], recentes = [] } = this.dados || {}, agora = Date.now();
    const ok = (e) => wlOk(e.tipo);
    const tz = { timeZone: "America/Sao_Paulo" };
    const dia = (ms) => new Date(ms).toLocaleDateString("pt-BR", { ...tz, weekday: "long", day: "2-digit", month: "2-digit" });
    const hoje = dia(agora), amanha = dia(agora + 86400e3);
    const hora = (e) => e.diaInteiro ? "dia todo" : new Date(e.inicio).toLocaleTimeString("pt-BR", { ...tz, hour: "2-digit", minute: "2-digit" }) + "–" + new Date(e.fim).toLocaleTimeString("pt-BR", { ...tz, hour: "2-digit", minute: "2-digit" });
    const card = (e, velho) => {
      const cls = velho || e.fim < agora ? "passou" : e.inicio <= agora + 10 * 60e3 ? "agora" : "";
      const sub = [`${WL_EMO[e.tipo] || ""} ${e.tipo}`, e.local && !/^https?:/.test(e.local) ? e.local : "", e.convidados.length ? e.convidados.length + " convidado(s)" : "", e.recorrente ? "↻" : ""].filter(Boolean).join(" · ");
      const rot = /meet\.google/.test(e.meet) ? "Meet" : /zoom/.test(e.meet) ? "Zoom" : "Teams";
      return `<div class="sc ev ${cls}"><span class="hr">${velho ? new Date(e.inicio).toLocaleDateString("pt-BR", { ...tz, day: "2-digit", month: "2-digit" }) : hora(e)}</span>
        <span class="tx"><b>${esc(e.titulo)}</b><span>${esc(sub)}</span></span>
        ${e.meet && !velho && e.fim > agora ? `<a class="meet" href="${esc(e.meet)}" target="_blank" rel="noopener">Entrar no ${rot}</a>` : ""}</div>`;
    };
    const grupos = new Map();
    for (const e of proximos.filter(ok)) { const d = dia(e.inicio); (grupos.get(d) || grupos.set(d, []).get(d)).push(e); }
    let h = wlSeg();
    if (!grupos.size) h += `<h3>Próximas 3 semanas</h3><p class="none">Nada marcado.</p>`;
    for (const [d, evs] of grupos) h += `<h3>${d === hoje ? "Hoje" : d === amanha ? "Amanhã" : esc(d)}</h3><div class="lista">${evs.map((e) => card(e)).join("")}</div>`;
    const rec = recentes.filter(ok);
    if (rec.length) h += `<h3>Últimos</h3><div class="lista">${rec.map((e) => card(e, true)).join("")}</div>`;
    this.box.innerHTML = h;
  }
  hojeCount() { const a = Date.now(), f = new Date(a).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
    return (this.dados?.proximos || []).filter((e) => e.fim > a && new Date(e.inicio).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" }) === f).length; }
  save() { return { kind: "agenda" }; }
  onWl() { if (this.dados) this.render(); }
  matches(s) { return s.kind === "agenda"; }
  tabInfo() { return { title: "Agenda", ind: ic("cal"), count: this.hojeCount() || "" }; }
  mount() { this.load(); }
  onShow() { if (!this.dados) this.load(); }
  focus() {}
  destroy() { clearInterval(this.timer); clearInterval(this.tick); }
}

  mount() {

  paintTools() {

    $(".seg.fontes", this.el).innerHTML = FONTES.map(([v, n]) => `<button data-fonte="${v}" class="${this.fonte === v ? "on" : ""}" style="--fc:var(--f-${v}, var(--ink))" role="tab" aria-selected="${this.fonte === v}">${n}${cnt(v) ? `<span class="n">${cnt(v)}</span>` : ""}</button>`).join("");

  renderList() {

      const c = S.wa.chats.find((x) => x.fonte === this.sel.fonte && x.id === this.sel.id);
      if (c) { this.chat = c; if (this.msgs.length) this.paintChat(false); }
    }
    const loading = !S.wa.at && S.wa.loading;
    if (loading) { this.list.innerHTML = Array.from({ length: 8 }, () => '<div class="skel"></div>').join(""); return; }
    const f = this.q.toLowerCase();
    let src = this.results || S.wa.chats;
    let list = src.filter((c) => (this.fonte === "todas" || c.fonte === this.fonte) && wlOk(wlChat(c)) && (!this.onlyWait || (c.esperando && Date.now() - c.at < WAIT_MS))
      && (this.results || !f || [c.nome, c.sub, c.preview].some((x) => String(x || "").toLowerCase().includes(f))));
    const errs = Object.entries(S.wa.erros || {}).map(([k, v]) => `<div class="werr">${k === "empresa" ? "Comercial/Suporte (CRM)" : k === "pessoal" ? "WhatsApp pessoal" : "WhatsApp"} indisponível agora: ${esc(v)}</div>`).join("");
    const top = this.list.scrollTop;
    this.list.innerHTML = errs + (list.slice(0, this.limit).map((c) => waItem(c, this.sel && this.sel.id === c.id && this.sel.fonte === c.fonte, `data-chat="${esc(c.fonte + ":" + c.id)}"`, this.fonte === "todas")).join("")

    this.list.scrollTop = top;
  }
  async open(fonte, id, refresh) {
    this.sel = { fonte, id }; saveTabs();
    this.chat = S.wa.chats.find((c) => c.fonte === fonte && c.id === id) || (this.results || []).find((c) => c.fonte === fonte && c.id === id) || this.chat?.id === id && this.chat || { fonte, id, nome: "…", sub: "" };
    this.wa.classList.add("detail");
    $$(".wi.on", this.list).forEach((x) => x.classList.remove("on"));
    $(`.wi[data-chat="${CSS.escape(fonte + ":" + id)}"]`, this.list)?.classList.add("on");
    if (!refresh) { this.msgs = []; this.antes = null; this.paintChat(true); }
    const seq = (this.seq = (this.seq || 0) + 1);
    const r = await api(`/api/wa/messages?fonte=${fonte}&id=${encodeURIComponent(id)}`);
    if (seq !== this.seq) return;
    if (!r.ok) { $(".wmsgs", this.wc).innerHTML = `<div class="wempty">Não consegui abrir esta conversa (${r.status}). Tente atualizar.</div>`; return; }
    const d = await r.json();

  }
  async older() {

    try {
      const d = await getJSON(`/api/wa/messages?fonte=${fonte}&id=${encodeURIComponent(id)}&antes=${encodeURIComponent(this.antes)}`);
      if (this.sel?.id !== id) return;

      box.scrollTop = box.scrollHeight - h0;
    } catch { toast("Não deu para carregar as anteriores"); }
    finally { this.loadingOlder = false; }
  }
  bubble(m, prev) {
    const c = this.chat, cont = prev && prev.eu === m.eu && prev.autor === m.autor && m.at - prev.at < 5 * 60e3 && dayKey(prev.at) === dayKey(m.at);
    const showAuthor = !cont && (m.eu ? c.fonte !== "pessoal" && m.autor : c.grupo && m.autor);
    let body = "";
    const t = m.tipo;
    if (t === "image" || t === "sticker") body = m.arquivo ? `<img src="${fileUrl(m.arquivo)}" loading="lazy" alt="Foto" data-img="${esc(m.arquivo)}"${t === "sticker" ? ' style="max-width:140px;background:none"' : ""}>` : `<div class="media">📷 ${t === "sticker" ? "Figurinha" : "Foto"}</div>`;
    else if (t === "video") body = m.arquivo ? `<video src="${fileUrl(m.arquivo)}" controls preload="none"></video>` : `<div class="media">🎬 Vídeo</div>`;
    else if (t === "audio") body = (m.arquivo ? `<audio src="${fileUrl(m.arquivo)}" controls preload="none"></audio>` : `<div class="media">🎤 Mensagem de voz</div>`)
      + (m.transcricao ? `<div class="trans"><small>Transcrição</small>${esc(m.transcricao)}</div>` : c.fonte === "pessoal" ? `<div class="media" style="font-size:12px">sem transcrição ainda</div>` : "");
    else if (t === "document") body = m.arquivo ? `<a class="doc" data-doc="${esc(m.arquivo)}">${ic("doc")}<span>${esc(m.nomeArquivo || base(m.arquivo))}</span></a>` : "";
    const txt = t === "audio" && !m.arquivo && /^🎤/.test(m.text) ? "" : (t !== "text" && /^(📷 Foto|🎬 Vídeo|📄 )/.test(m.text) && (t !== "document" || m.arquivo) ? "" : m.text);
    if (t === "document" && !m.arquivo && txt) body = `<div class="doc">${ic("doc")}<span>${waFmt(txt.replace(/^📄\s*/, ""))}</span></div>`;
    const showTxt = txt && !(t === "document" && !m.arquivo);
    return `<div class="bub${m.eu ? " eu" : ""}${cont ? " cont" : ""} f-${c.fonte}"${showAuthor ? ` style="--h:${hue(m.autor)}"` : ""}>${showAuthor ? `<span class="au">${esc(m.autor)}</span>` : ""}${body}${showTxt ? `<span class="tx">${waFmt(txt)}</span>` : ""}<span class="hr">${hm(m.at)}</span></div>`;
  }
  paintChat(loading, toEnd) {
    const c = this.chat;
    const box0 = $(".wmsgs", this.wc), keep = box0 && !toEnd ? box0.scrollTop : null;
    let html = "", prev = null;
    for (const m of this.msgs) {
      if (!prev || dayKey(prev.at) !== dayKey(m.at)) { html += `<div class="wday">${esc(dayLabel(m.at))}</div>`; prev = null; }
      html += this.bubble(m, prev); prev = m;
    }
    this.wc.innerHTML = `<div class="wch"><button class="ib back" data-a="back" aria-label="Voltar para a lista">${ic("back")}</button>${avatar(c)}
        <div class="who"><b>${esc(c.nome)}</b><span><span class="fpill f-${c.fonte}">${esc(c.fonte)}</span><em>${esc(c.sub || "")}</em></span></div>
        <button class="ib rf" data-a="refresh" title="Atualizar" aria-label="Atualizar">${ic("refresh")}</button><button class="askbtn" data-a="ask" title="Abre uma conversa do Claude com o contexto no campo, sem enviar">${ic("reply")}<span>Responder <span class="lbl2">no manager</span></span></button></div>
      <div class="wmsgs">${loading ? '<div class="skel" style="width:60%"></div><div class="skel" style="width:45%;align-self:flex-end"></div><div class="skel" style="width:55%"></div>'
        : (this.antes ? `<button class="more" data-a="older">Carregar anteriores</button>` : "") + (html || '<div class="wempty">Sem mensagens.</div>')}</div>
      <div class="wfoot">Só leitura: nada é enviado daqui. Horários de Brasília.</div>`;
    const box = $(".wmsgs", this.wc);
    if (keep != null && !toEnd) box.scrollTop = keep; else box.scrollTop = box.scrollHeight;
    box.onscroll = () => { if (box.scrollTop < 60 && this.antes) this.older(); };
  }
  // Abre uma conversa do Claude com o contexto no campo; nada é enviado sem o usuário apertar Enviar.
  ask() {
    const c = this.chat; if (!c || !this.msgs.length) return toast("Espere a conversa carregar");
    const fmt = (t) => `${fDM.format(t).slice(0, 5)} ${hm(t)}`;
    const quem = (m) => m.eu ? (c.fonte === "pessoal" ? "Eu" : !m.autor || m.autor === "Você" ? "RT" : /^RT\b/.test(m.autor) ? m.autor : `RT (${m.autor})`) : (c.grupo ? m.autor || "alguém" : c.nome);
    const texto = (m) => m.tipo === "audio" ? `[áudio] ${m.transcricao || "(sem transcrição)"}` : m.tipo === "image" ? `[foto] ${m.text || ""}`.trim()
      : m.tipo === "document" ? `[documento] ${m.nomeArquivo || m.text || ""}`.trim() : m.text;
    const ult = this.msgs.slice(-30);
    const ctx = `Contexto: conversa de WhatsApp ${FONTE_NOME[c.fonte]} com ${c.nome}${c.sub ? ` (${c.sub})` : ""}. Últimas ${ult.length} mensagens, horário de Brasília:\n\n`
      + ult.map((m) => `[${fmt(m.at)}] ${quem(m)}: ${String(texto(m) || "").replace(/\s+/g, " ").trim()}`).join("\n")
      + `\n\nMe ajude a responder: redija a resposta para eu revisar. Não envie nada.`;
    const p = openTab({ kind: "conv", id: null, text: ctx }, { side: !narrow() });
    p.input.value = ctx; requestAnimationFrame(() => { p.autosize(); p.input.scrollTop = p.input.scrollHeight; });
    toast("Contexto no campo. Revise e envie quando quiser.");
  }
}

      ${m.status === "connected" ? `<div class="btns"><button data-mcpask="${esc(m.name)}">Usar na conversa</button></div>` : ""}</div>`).join("")}` : ""}
    ${ssh.length ? `<div class="group">Servidores SSH</div>${ssh.map((h) => `<div class="card"><div class="row"><b class="mono">${esc(h.alias)}</b></div>
      <div class="desc mono">${esc([h.user, h.hostname || h.aliases.join(" ")].filter(Boolean).join("@"))}${h.key ? `, ${esc(tilde(h.key))}` : ""}</div>
      <div class="btns"><button data-sshterm="${esc(h.alias)}">Terminal</button><button data-sshconv="${esc(h.alias)}">Pedir ao Claude</button><button data-sshpc="${esc(h.alias)}">Abrir no PC</button></div></div>`).join("")}` : ""}
    ${keys.length ? `<div class="group">Chaves SSH <button data-path="${esc(c.home)}/.ssh">Pasta</button></div>${keys.map((k) => `<div class="card"><div class="row"><b class="mono">${esc(k.name)}</b><span class="badge">${esc(k.type)}</span></div>
      <div class="desc mono" style="word-break:break-all">${esc(k.fingerprint)}</div><div class="desc">${esc(k.comment)}</div>
      <div class="btns"><button data-copy="${esc(k.name)}">Copiar pública</button></div></div>`).join("")}` : ""}
    ${skills.length ? `<div class="group">Skills (${skills.length}). Toque para usar</div>${skills.map((s) => `<div class="skill" data-skill="${esc(s.name)}"><b>/${esc(s.name)}</b><div>${esc(s.description)}</div></div>`).join("")}` : ""}
    ${agents.length ? `<div class="group">Subagentes</div>${agents.map((a) => `<div class="skill" style="cursor:default"><b>${esc(a.name)}</b><div>${esc(a.description)}</div></div>`).join("")}` : ""}
    <div class="muted" style="font-size:12px;padding:12px 8px">Verificado há ${ago(c.at)}.</div>`;
}

function palette() {

  const actions = [
    ["ação", "Nova conversa", () => openTab({ kind: "conv", id: null })],

    ["ação", "Workload: pessoal", () => setWl("pessoal")],

    ["ação", "Ver integrações", () => setSide("integ")],
    ["ação", "Atualizar integrações", () => loadCatalog(true)],
    ["ação", "Trocar tema (auto, claro, escuro)", () => cycleTheme()],
  ];
  const all = () => [
    ...actions,
    ...S.convs.map((c) => ["conversa", c.title, () => openTab({ kind: "conv", id: c.id }), tilde(c.cwd)]),
    ...S.terms.map((t) => ["terminal", t.title, () => openTab({ kind: "term", id: t.id }), tilde(t.cwd)]),
    ...S.wa.chats.slice(0, 400).map((c) => ["whatsapp", c.nome, () => openWa({ fonte: c.fonte, id: c.id }), `${c.fonte}${c.sub ? ", " + c.sub : ""}`]),
    ...(S.catalog?.ssh || []).map((h) => ["ssh", h.alias, () => newTerm({ ssh: h.alias }), h.hostname]),
    ...(S.catalog?.skills || []).map((s) => ["skill", "/" + s.name, () => { const p = activeConv() || openTab({ kind: "conv", id: null }); showTab(p, false); p.insert("/" + s.name); }, s.description]),
  ];
  const close = () => wrap.remove();
  const paint = () => {
    const q = inp.value.trim().toLowerCase();
    items = /^[\/~]/.test(q) && q.length > 1 && !(S.catalog?.skills || []).some((s) => ("/" + s.name).startsWith(q))
      ? [["caminho", inp.value.trim(), () => showFiles(inp.value.trim())]]
      : all().filter(([k, t, , d]) => !q || t.toLowerCase().includes(q) || k.includes(q) || (d || "").toLowerCase().includes(q)).slice(0, 60);
    sel = Math.min(sel, Math.max(0, items.length - 1));
    res.innerHTML = items.map(([k, t, , d], i) => `<div data-i="${i}"${i === sel ? ' class="on"' : ""}><em>${esc(k)}</em><b style="font-weight:550;white-space:nowrap">${esc(t)}</b><span>${esc(d || "")}</span></div>`).join("") || `<div class="muted">Nada encontrado.</div>`;
  };
  inp.oninput = () => { sel = 0; paint(); };
  inp.onkeydown = (e) => {
    if (e.key === "Escape") close();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % (items.length || 1); paint(); $$(".on", res)[0]?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter" && items[sel]) { close(); items[sel][2](); }
  };
  res.onclick = (e) => { const d = e.target.closest("[data-i]"); if (d) { close(); items[+d.dataset.i][2](); } };
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  paint(); inp.focus();
}

// --- uso da assinatura (rodapé da barra lateral) -------------------------------------
function paintUsage(u) {
  const el = $("#usage"); if (!u || (!u.five && !u.week)) { el.innerHTML = u?.error ? `<span title="${esc(u.error)}">uso indisponível</span>` : ""; return; }
  const when = (t) => dayKey(t) === dayKey(Date.now()) ? hm(t) : new Date(t).toLocaleString("pt-BR", { timeZone: TZ, weekday: "short", hour: "2-digit", minute: "2-digit" });
  const durH = (h) => h < 1 ? `${Math.round(h * 60)} min` : h < 48 ? `${h.toFixed(1).replace(".", ",")} h` : `${Math.round(h / 24)} d`;
  const row = (label, l) => {
    if (!l || l.pct == null) return "";
    const pct = Math.round(l.pct), reset = l.resetsAt ? Date.parse(l.resetsAt) : null;
    let eta = "medindo taxa…", cls = "";
    if (l.rate === 0) eta = "parado, reinicia " + (reset ? when(reset) : "");
    else if (l.rate != null) {
      const hLeft = (100 - l.pct) / l.rate, empty = Date.now() + hLeft * 3600e3;
      const before = reset && empty < reset;
      cls = before ? (hLeft < 1 ? "err" : "warn") : "";
      eta = `${l.rate.toFixed(1).replace(".", ",")}%/h, ` + (before ? `esgota em ${durH(hLeft)} (${when(empty)})` : `ok até reiniciar ${reset ? when(reset) : ""}`);
    } else if (reset) eta = "medindo taxa…, reinicia " + when(reset);
    const bar = pct >= 90 ? "err" : pct >= 70 ? "warn" : "";
    return `<div class="row"><div class="top"><b>${label}</b><span class="pct">${pct}%</span></div>
      <div class="bar"><i class="${bar}" style="width:${Math.min(100, pct)}%"></i></div>
      <div class="eta ${cls}">${eta}</div></div>`;
  };
  el.innerHTML = row("Sessão 5 h", u.five) + row("Semana", u.week) + (u.error ? `<span class="eta warn" title="${esc(u.error)}">última leitura falhou, mostrando ${hm(u.at)}</span>` : "");
}

// --- tema -----------------------------------------------------------------------------------------
const THEMES = ["auto", "light", "dark"], THEME_NAME = { auto: "automático", light: "claro", dark: "escuro" };
function applyTheme() {
  const t = localStorage.getItem("v2.theme") || "auto";
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  $('meta[name="theme-color"]').content = dark ? "#0e1319" : "#eceff2";
  $("#railTheme").title = `Tema: ${THEME_NAME[t]} (trocar)`;
}
function cycleTheme() {
  const t = localStorage.getItem("v2.theme") || "auto", n = THEMES[(THEMES.indexOf(t) + 1) % 3];
  localStorage.setItem("v2.theme", n); applyTheme(); toast(`Tema ${THEME_NAME[n]}`);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

// --- eventos do servidor ------------------------------------------------------------------
function connect() {
  const es = new EventSource("/api/events");
  let first = true;
  es.onopen = () => { S.online = true; paintHubs(); S.tabs.forEach((p) => p.kind === "conv" && p.paintHead()); };
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "usage") { S.usage = ev.usage; return paintUsage(ev.usage); }
    if (ev.type === "notes") { S.notes = ev.notes; return paintHubs(); }
    if (ev.type === "note") { S.notes.push(ev.note); alertNote(ev.note); return paintHubs(); }
    if (ev.type === "seen") { S.notes.forEach((n) => { if (!ev.conv || n.conv === ev.conv) n.read = true; }); return paintHubs(); }
    if (ev.type === "activity") { const c = S.convs.find((c) => c.id === ev.conv); if (c) Object.assign(c, { activity: ev.activity, tail: ev.tail }); return paintActivity(ev.conv); }
    if (ev.type === "list") {
      S.convs = ev.convs; S.terms = ev.terms || [];
      for (const p of S.tabs) {
        if (p.kind === "conv" && p.id) { const m = S.convs.find((c) => c.id === p.id); if (m) { p.meta = { ...p.meta, ...m }; p.paintHead(); } }
        if (p.kind === "term") p.paintHead();
      }
      if (first) {
        first = false;
        S.tabs.forEach((p) => p.kind === "conv" && p.id && p.mount());
        S.tabs.filter((p) => p.kind === "term" && !S.terms.some((t) => t.id === p.id)).forEach(closeTab); // terminal sumiu (servidor reiniciou)
      }
      renderConvs(); paintHubs(); paintBadges(); renderTabsSoon(); seenVisible();
      return;
    }
    for (const p of S.tabs) if (p.kind === "conv" && p.id === ev.conv) p.onEvent(ev);
  };
  es.onerror = () => { first = true; S.online = false; paintHubs(); S.tabs.forEach((p) => p.kind === "conv" && p.paintHead()); };
}

(function restore() {
  applyTheme();
  let saved = [], view = [], f = 0;
  try { saved = JSON.parse(localStorage.getItem("v2.tabs") || "[]"); view = JSON.parse(localStorage.getItem("v2.view") || "[]"); f = +localStorage.getItem("v2.focus") || 0; } catch {}
  if (!saved.length) { try { saved = JSON.parse(localStorage.getItem("panes") || "[]"); } catch {} view = saved.map((_, i) => i).slice(0, maxView()); } // herda os painéis da UI antiga
  if (!saved.length) saved = [{ kind: "conv", id: null }];
  for (const spec of saved.slice(0, 16)) { const p = makePane(spec); p.el.hidden = true; panesEl.appendChild(p.el); S.tabs.push(p); }
  S.tabs.forEach((t) => seenTabs.add(t)); // abas restauradas não animam a entrada
  S.view = view.map((i) => S.tabs[i]).filter(Boolean);
  if (!S.view.length) S.view = [S.tabs[0]];
  S.focus = Math.min(f, S.view.length - 1);

    $("a", box).onclick = (e) => { e.preventDefault(); box.hidden = true; };

}
